<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOBER SLOTS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background: #1a1a1a; /* Фоновый цвет на случай отсутствия картинки */
            background: url('back.png') center/cover fixed;
            font-family: -apple-system, sans-serif;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container{
            max-width: 420px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            background: rgba(0,0,0,0.6);
        }
        .header{
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid #ff8c00;
        }
        .header h1{
            color: #ff8c00;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px black;
        }
        .balance{
            font-size: 22px;
            background: linear-gradient(145deg, #ff8c00, #ffae00);
            padding: 10px 25px;
            border-radius: 25px;
            color: #000;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
        }
        .game-box{
            background: rgba(0,0,0,0.8);
            border: 2px solid #ff8c00;
            border-radius: 20px;
            padding: 25px;
            margin: 15px 0;
            text-align: center;
        }
        .slots-row{
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .slot-item{
            width: 90px;
            height: 90px;
            background: #111;
            border: 3px solid #ff8c00;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }
        .bet-section{
            text-align: center;
            margin: 20px 0;
        }
        .bet-section input{
            width: 150px;
            padding: 15px;
            font-size: 22px;
            text-align: center;
            background: #000;
            border: 2px solid #ff8c00;
            border-radius: 10px;
            color: white;
            margin-bottom: 10px;
        }
        .quick-btns{
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .quick-btns button{
            padding: 8px 12px;
            background: #333;
            border: 1px solid #ff8c00;
            border-radius: 8px;
            color: #ff8c00;
            font-weight: bold;
        }
        .play-btn{
            width: 100%;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            background: #ff8c00;
            border: none;
            border-radius: 15px;
            color: #000;
            cursor: pointer;
            box-shadow: 0 5px 0 #b36200;
        }
        .play-btn:active{
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b36200;
        }
        .result-msg{
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
        .win-msg{ background: rgba(0,255,0,0.2); border: 1px solid #00ff00; color: #00ff00; }
        .lose-msg{ background: rgba(255,0,0,0.2); border: 1px solid #ff0000; color: #ff6666; }
        .nav-btns{
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .nav-btns button{
            flex: 1;
            padding: 15px;
            background: #222;
            border: 1px solid #444;
            border-radius: 10px;
            color: #888;
            font-weight: bold;
        }
        .nav-btns button.active{
            border-color: #ff8c00;
            color: #ff8c00;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦫 BOBER SLOTS</h1>
            <div class="balance">💰 <span id="bal">Загрузка...</span></div>
        </div>

        <div id="game-slots">
            <div class="game-box">
                <div class="slots-row">
                    <div class="slot-item" id="s1">🦫</div>
                    <div class="slot-item" id="s2">🦫</div>
                    <div class="slot-item" id="s3">🦫</div>
                </div>
            </div>
            <div class="bet-section">
                <input type="number" id="slotBet" value="100">
                <div class="quick-btns">
                    <button onclick="setSlotBet(100)">100</button>
                    <button onclick="setSlotBet(500)">500</button>
                    <button onclick="setSlotBet(1000)">1000</button>
                </div>
            </div>
            <button class="play-btn" id="spinBtn" onclick="playSlots()">🎰 КРУТИТЬ</button>
            <div id="slotResult"></div>
        </div>

        <div class="nav-btns">
            <button class="active">СЛОТЫ</button>
            <button onclick="alert('Скоро!')">КОСТИ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // !!! ВАЖНО: ЗАМЕНИТЕ ЭТУ ССЫЛКУ НА ВАШ АДРЕС NGROK ИЛИ СЕРВЕРА !!!
        const API_BASE = "https://ВАШ-АДРЕС.ngrok-free.app"; 
        
        const userId = tg.initDataUnsafe?.user?.id || 0;
        let balance = 0;
        let isSpinning = false;

        // Загрузка баланса с сервера
        async function fetchBalance() {
            if (isSpinning) return; // Не обновлять во время анимации
            try {
                const response = await fetch(`${API_BASE}/get_balance?user_id=${userId}`);
                const data = await response.json();
                balance = data.balance;
                document.getElementById('bal').textContent = balance;
            } catch (e) {
                console.error("Ошибка связи с сервером");
                document.getElementById('bal').textContent = "Ошибка";
            }
        }

        // Обновление баланса на сервере (после игры)
        async function updateServerBalance(amountChange) {
            try {
                await fetch(`${API_BASE}/update_balance`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, amount: amountChange })
                });
            } catch (e) { console.error("Ошибка сохранения"); }
        }

        function setSlotBet(v) { document.getElementById('slotBet').value = v; }

        async function playSlots() {
            if (isSpinning) return;
            const bet = parseInt(document.getElementById('slotBet').value);
            
            if (bet > balance) {
                alert("Недостаточно монет! Получите бонус в боте.");
                return;
            }

            isSpinning = true;
            balance -= bet;
            document.getElementById('bal').textContent = balance;
            
            // Сразу сообщаем серверу о ставке
            await updateServerBalance(-bet);

            const sym = ['🦫','🍋','🍊','🍇','💎','7️⃣'];
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.style.opacity = "0.5";

            // Анимация
            for (let i = 0; i < 10; i++) {
                document.getElementById('s1').textContent = sym[Math.floor(Math.random()*6)];
                document.getElementById('s2').textContent = sym[Math.floor(Math.random()*6)];
                document.getElementById('s3').textContent = sym[Math.floor(Math.random()*6)];
                await new Promise(r => setTimeout(r, 100));
            }

            const r = [sym[Math.floor(Math.random()*6)], sym[Math.floor(Math.random()*6)], sym[Math.floor(Math.random()*6)]];
            document.getElementById('s1').textContent = r[0];
            document.getElementById('s2').textContent = r[1];
            document.getElementById('s3').textContent = r[2];

            let win = 0;
            if (r[0] === r[1] && r[1] === r[2]) win = bet * 10;
            else if (r[0] === r[1] || r[1] === r[2] || r[0] === r[2]) win = Math.floor(bet * 1.5);

            if (win > 0) {
                balance += win;
                await updateServerBalance(win);
                showResult(`ВЫИГРЫШ: +${win}`, true);
            } else {
                showResult(`ПРОИГРЫШ: -${bet}`, false);
            }

            document.getElementById('bal').textContent = balance;
            isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.style.opacity = "1";
        }

        function showResult(msg, isWin) {
            const res = document.getElementById('slotResult');
            res.textContent = msg;
            res.className = 'result-msg ' + (isWin ? 'win-msg' : 'lose-msg');
        }

        // Первичная загрузка
        fetchBalance();

        // Проверка баланса каждые 5 секунд (на случай если админ выдал бонус)
        setInterval(fetchBalance, 5000);

    </script>
</body>
</html>
