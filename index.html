cd ~/bober-slots
cat > index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOBER SLOTS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background: url('back.png') center/cover fixed;
            font-family: -apple-system, sans-serif;
            color: white;
            min-height: 100vh;
        }
        .container{
            max-width: 420px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            background: rgba(0,0,0,0.5);
        }
        .header{
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .header h1{
            color: #ff8c00;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px black;
        }
        .balance{
            font-size: 20px;
            background: #ff8c00;
            padding: 10px 25px;
            border-radius: 25px;
            color: #000;
            font-weight: bold;
            display: inline-block;
        }
        .bonus-alert{
            background: rgba(0,255,0,0.3);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
            text-align: center;
            color: #00ff00;
            font-weight: bold;
        }
        .game-box{
            background: rgba(0,0,0,0.7);
            border: 2px solid #ff8c00;
            border-radius: 20px;
            padding: 25px;
            margin: 15px 0;
            text-align: center;
        }
        .slots-row{
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .slot-item{
            width: 90px;
            height: 90px;
            background: rgba(0,0,0,0.8);
            border: 3px solid #ff8c00;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }
        .dice-box{
            font-size: 100px;
            margin: 20px 0;
        }
        .bet-section{
            margin: 20px 0;
        }
        .bet-section input{
            width: 150px;
            padding: 15px;
            font-size: 22px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            border: 2px solid #ff8c00;
            border-radius: 10px;
            color: white;
        }
        .quick-btns{
            margin: 10px 0;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .quick-btns button{
            padding: 10px 15px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #ff8c00;
            border-radius: 8px;
            color: #ff8c00;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .play-btn{
            width: 100%;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            background: #ff8c00;
            border: none;
            border-radius: 15px;
            color: #000;
            cursor: pointer;
            margin: 15px 0;
        }
        .play-btn:active{
            background: #ff6600;
        }
        .result-msg{
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            margin: 10px 0;
            min-height: 50px;
        }
        .win-msg{
            background: rgba(0,150,0,0.5);
            border: 2px solid #00ff00;
            color: #00ff00;
        }
        .lose-msg{
            background: rgba(150,0,0,0.5);
            border: 2px solid #ff0000;
            color: #ff6666;
        }
        .nav-btns{
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .nav-btns button{
            flex: 1;
            padding: 15px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #333;
            border-radius: 10px;
            color: #aaa;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btns button.active{
            border-color: #ff8c00;
            color: #ff8c00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦫 BOBER SLOTS</h1>
            <div class="balance">💰 <span id="bal">10000</span> монет</div>
            <div id="bonusAlert" class="bonus-alert" style="display:none;"></div>
        </div>

        <div id="game-slots">
            <div class="game-box">
                <div class="slots-row">
                    <div class="slot-item" id="s1">🦫</div>
                    <div class="slot-item" id="s2">🦫</div>
                    <div class="slot-item" id="s3">🦫</div>
                </div>
            </div>
            <div class="bet-section">
                <p style="color:#ff8c00;margin-bottom:10px">СТАВКА:</p>
                <input type="number" id="slotBet" value="100" min="10">
                <div class="quick-btns">
                    <button onclick="setSlotBet(50)">50</button>
                    <button onclick="setSlotBet(100)">100</button>
                    <button onclick="setSlotBet(500)">500</button>
                    <button onclick="setSlotBet(1000)">1000</button>
                </div>
            </div>
            <button class="play-btn" onclick="playSlots()">🎰 КРУТИТЬ</button>
            <div id="slotResult"></div>
        </div>

        <div id="game-dice" style="display:none">
            <div class="game-box">
                <div class="dice-box" id="diceFace">🎲</div>
            </div>
            <div class="bet-section">
                <p style="color:#ff8c00;margin-bottom:10px">ТИП СТАВКИ:</p>
                <div class="quick-btns">
                    <button id="diceHigh" style="border-color:#ff8c00" onclick="setDice('high')">Больше 3</button>
                    <button id="diceLow" onclick="setDice('low')">Меньше 4</button>
                    <button id="diceExact" onclick="setDice('exact')">Ровно 6</button>
                </div>
                <p style="color:#ff8c00;margin:15px 0 10px 0">СТАВКА:</p>
                <input type="number" id="diceBet" value="100" min="10">
                <div class="quick-btns">
                    <button onclick="setDiceBetVal(50)">50</button>
                    <button onclick="setDiceBetVal(100)">100</button>
                    <button onclick="setDiceBetVal(500)">500</button>
                    <button onclick="setDiceBetVal(1000)">1000</button>
                </div>
            </div>
            <button class="play-btn" onclick="playDice()">🎲 БРОСИТЬ</button>
            <div id="diceResult"></div>
        </div>

        <div class="nav-btns">
            <button id="navSlots" class="active" onclick="showGame('slots')">🎰 СЛОТЫ</button>
            <button id="navDice" onclick="showGame('dice')">🎲 КОСТИ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let balance = 10000;
        let diceType = 'high';
        
        const initData = tg.initDataUnsafe || {};
        const userId = initData.user ? initData.user.id : null;
        const userKey = 'bober_balance_' + (userId || 'guest');

        // Загружаем сохранённый баланс
        const savedBalance = localStorage.getItem(userKey);
        if (savedBalance) {
            balance = parseInt(savedBalance);
        }
        updateBal();

        // Запрашиваем бонусы у бота
        function checkBonus() {
            if (userId) {
                tg.sendData(JSON.stringify({
                    action: 'request_bonus',
                    user_id: userId
                }));
            }
        }

        // Проверяем бонусы при запуске
        checkBonus();

        // Проверяем бонусы каждые 10 секунд
        setInterval(checkBonus, 10000);

        // Обработка ответа от бота (бонусы)
        window.addEventListener('message', function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.bonus && data.bonus > 0) {
                    balance += data.bonus;
                    updateBal();
                    saveBalance();
                    
                    document.getElementById('bonusAlert').textContent = '🎁 Получен бонус: +' + data.bonus + ' монет!';
                    document.getElementById('bonusAlert').style.display = 'block';
                    setTimeout(function() {
                        document.getElementById('bonusAlert').style.display = 'none';
                    }, 5000);
                }
            } catch(e) {}
        });

        function saveBalance() {
            localStorage.setItem(userKey, balance);
            
            if (userId) {
                tg.sendData(JSON.stringify({
                    action: 'balance_update',
                    user_id: userId,
                    amount: balance
                }));
            }
        }

        function showGame(game) {
            document.getElementById('game-slots').style.display = game === 'slots' ? 'block' : 'none';
            document.getElementById('game-dice').style.display = game === 'dice' ? 'block' : 'none';
            document.getElementById('navSlots').className = game === 'slots' ? 'active' : '';
            document.getElementById('navDice').className = game === 'dice' ? 'active' : '';
        }

        function updateBal() {
            document.getElementById('bal').textContent = balance;
        }

        function setSlotBet(v) { document.getElementById('slotBet').value = v; }
        function setDiceBetVal(v) { document.getElementById('diceBet').value = v; }

        function setDice(t) {
            diceType = t;
            document.getElementById('diceHigh').style.borderColor = t === 'high' ? '#ff8c00' : '#333';
            document.getElementById('diceLow').style.borderColor = t === 'low' ? '#ff8c00' : '#333';
            document.getElementById('diceExact').style.borderColor = t === 'exact' ? '#ff8c00' : '#333';
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function playSlots() {
            const bet = parseInt(document.getElementById('slotBet').value);
            if (bet < 10) { showSlotResult('Минимальная ставка: 10!', false); return; }
            if (bet > balance) { 
                showSlotResult('Недостаточно монет! Возьмите бонус в боте 🎁', false); 
                return; 
            }

            balance -= bet;
            updateBal();

            const sym = ['🦫','🍋','🍊','🍇','💎','7️⃣'];
            
            for (let i = 0; i < 8; i++) {
                await sleep(120);
                document.getElementById('s1').textContent = sym[Math.floor(Math.random()*6)];
                document.getElementById('s2').textContent = sym[Math.floor(Math.random()*6)];
                document.getElementById('s3').textContent = sym[Math.floor(Math.random()*6)];
            }

            const r1 = sym[Math.floor(Math.random()*6)];
            const r2 = sym[Math.floor(Math.random()*6)];
            const r3 = sym[Math.floor(Math.random()*6)];
            
            document.getElementById('s1').textContent = r1;
            document.getElementById('s2').textContent = r2;
            document.getElementById('s3').textContent = r3;

            let win = 0, msg = '';
            
            if (r1 === r2 && r2 === r3) {
                let m = 5;
                if (r1 === '7️⃣') m = 10;
                if (r1 === '💎') m = 15;
                win = bet * m;
                msg = '🎉 ДЖЕКПОТ x' + m + '! +' + win;
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                win = Math.floor(bet * 1.5);
                msg = '✅ Два совпадения! +' + win;
            } else {
                msg = '😔 Не повезло! -' + bet;
            }

            balance += win;
            updateBal();
            saveBalance();
            showSlotResult(msg, win > 0);
        }

        function showSlotResult(msg, win) {
            const el = document.getElementById('slotResult');
            el.textContent = msg;
            el.className = 'result-msg ' + (win ? 'win-msg' : 'lose-msg');
        }

        async function playDice() {
            const bet = parseInt(document.getElementById('diceBet').value);
            if (bet < 10) { showDiceResult('Минимальная ставка: 10!', false); return; }
            if (bet > balance) { 
                showDiceResult('Недостаточно монет! Возьмите бонус в боте 🎁', false); 
                return; 
            }

            balance -= bet;
            updateBal();

            const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
            
            for (let i = 0; i < 8; i++) {
                await sleep(100);
                document.getElementById('diceFace').textContent = faces[Math.floor(Math.random()*6)];
            }

            const result = Math.floor(Math.random()*6) + 1;
            document.getElementById('diceFace').textContent = faces[result-1];

            let win = false, mult = 0;
            if (diceType === 'high' && result > 3) { win = true; mult = 1.5; }
            if (diceType === 'low' && result < 4) { win = true; mult = 1.5; }
            if (diceType === 'exact' && result === 6) { win = true; mult = 5; }

            let msg = 'Выпало: ' + result + ' ';
            if (win) {
                const wa = Math.floor(bet * mult);
                balance += wa;
                msg += '🎉 ВЫИГРЫШ x' + mult + '! +' + wa;
            } else {
                msg += '😔 ПРОИГРЫШ! -' + bet;
            }

            updateBal();
            saveBalance();
            showDiceResult(msg, win);
        }

        function showDiceResult(msg, win) {
            const el = document.getElementById('diceResult');
            el.textContent = msg;
            el.className = 'result-msg ' + (win ? 'win-msg' : 'lose-msg');
        }

        setDice('high');
        showGame('slots');
    </script>
</body>
</html>
EOF
