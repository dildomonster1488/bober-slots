<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOBER SLOTS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .balance-box { background: #ff8c00; color: black; padding: 15px; border-radius: 15px; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .slot-container { display: flex; justify-content: center; gap: 10px; margin: 30px 0; }
        .slot { width: 80px; height: 80px; background: #000; border: 3px solid #ff8c00; border-radius: 10px; font-size: 40px; display: flex; align-items: center; justify-content: center; }
        .btn { background: #ff8c00; border: none; padding: 15px 30px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; }
        .btn:disabled { background: #555; }
        input { width: 100px; padding: 10px; font-size: 18px; margin-bottom: 10px; border-radius: 5px; border: none; text-align: center; }
    </style>
</head>
<body>

    <div class="balance-box">💰 <span id="bal">Загрузка...</span></div>

    <div class="slot-container">
        <div class="slot" id="s1">🦫</div>
        <div class="slot" id="s2">🦫</div>
        <div class="slot" id="s3">🦫</div>
    </div>

    <p>СТАВКА:</p>
    <input type="number" id="betInput" value="100">
    
    <button class="btn" id="spinBtn" onclick="play()">🎰 КРУТИТЬ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // СЮДА ВСТАВИТЬ ССЫЛКУ ИЗ NGROK
        const API_URL = "https://ВАШ_АДРЕС.ngrok-free.app"; 
        
        const userId = tg.initDataUnsafe?.user?.id || 0;
        let currentBalance = 0;

        // Получить баланс с сервера
        async function loadBalance() {
            try {
                const res = await fetch(`${API_URL}/get_balance?user_id=${userId}`);
                const data = await res.json();
                currentBalance = data.balance;
                document.getElementById('bal').textContent = currentBalance;
            } catch (e) { console.log("Ошибка API"); }
        }

        // Отправить изменение баланса (выигрыш или ставку)
        async function syncBalance(change) {
            try {
                const res = await fetch(`${API_URL}/update_balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, amount: change })
                });
                const data = await res.json();
                currentBalance = data.balance;
                document.getElementById('bal').textContent = currentBalance;
            } catch (e) { console.log("Ошибка синхронизации"); }
        }

        async function play() {
            const bet = parseInt(document.getElementById('betInput').value);
            if (bet > currentBalance) {
                alert("Недостаточно монет!");
                return;
            }

            const btn = document.getElementById('spinBtn');
            btn.disabled = true;

            // 1. Снимаем ставку
            await syncBalance(-bet);

            // 2. Анимация
            const symbols = ['🦫', '💎', '7️⃣', '🍋', '🍇'];
            for(let i=0; i<10; i++) {
                document.getElementById('s1').textContent = symbols[Math.floor(Math.random()*5)];
                document.getElementById('s2').textContent = symbols[Math.floor(Math.random()*5)];
                document.getElementById('s3').textContent = symbols[Math.floor(Math.random()*5)];
                await new Promise(r => setTimeout(r, 100));
            }

            // 3. Результат
            const r = [symbols[Math.floor(Math.random()*5)], symbols[Math.floor(Math.random()*5)], symbols[Math.floor(Math.random()*5)]];
            document.getElementById('s1').textContent = r[0];
            document.getElementById('s2').textContent = r[1];
            document.getElementById('s3').textContent = r[2];

            // 4. Проверка выигрыша
            let win = 0;
            if (r[0] === r[1] && r[1] === r[2]) win = bet * 10;
            else if (r[0] === r[1] || r[1] === r[2] || r[0] === r[2]) win = Math.floor(bet * 1.5);

            if (win > 0) {
                await syncBalance(win);
                alert("Победа! +" + win);
            }

            btn.disabled = false;
        }

        loadBalance();
        setInterval(loadBalance, 5000); // Проверять баланс каждые 5 сек (для бонусов)
    </script>
</body>
</html>
