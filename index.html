cat > index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOBER SLOTS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: url('back.png') center/cover fixed;
            font-family: -apple-system, sans-serif;
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 15px;
            margin-bottom: 10px;
        }
        .header h1 {
            color: #ff8c00;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .balance {
            font-size: 18px;
            background: rgba(255,140,0,0.3);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid #ff8c00;
        }
        .slots-frame {
            background: rgba(0,0,0,0.7);
            border: 3px solid #ff8c00;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
        }
        .slots-display {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .slot {
            width: 100px;
            height: 100px;
            background: #1a1a1a;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            border: 2px solid #ff8c00;
        }
        .dice-display {
            text-align: center;
            margin: 20px 0;
            background: rgba(0,0,0,0.7);
            border: 3px solid #ff8c00;
            border-radius: 20px;
            padding: 30px;
        }
        .dice {
            font-size: 90px;
        }
        .bet-controls {
            margin: 15px 0;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 15px;
        }
        .bet-controls label {
            color: #ff8c00;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
        .bet-controls input {
            width: 130px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            border: 2px solid #ff8c00;
            border-radius: 10px;
            color: white;
            margin-bottom: 10px;
        }
        .quick-bets {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .quick-bets button {
            padding: 8px 14px;
            background: rgba(255,140,0,0.3);
            border: 1px solid #ff8c00;
            border-radius: 8px;
            color: #ff8c00;
            font-weight: bold;
            cursor: pointer;
        }
        .quick-bets button:active {
            background: rgba(255,140,0,0.6);
        }
        .spin-btn, .roll-btn {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(#ff8c00, #ff6600);
            border: none;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            margin: 10px 0;
        }
        .spin-btn:active, .roll-btn:active {
            transform: scale(0.97);
        }
        .spin-btn:disabled, .roll-btn:disabled {
            background: #666;
            opacity: 0.5;
        }
        .dice-bet-type {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 15px 0;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 15px;
        }
        .dice-type-btn {
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border: 2px solid transparent;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .dice-type-btn.active {
            border-color: #ff8c00;
            background: rgba(255,140,0,0.3);
        }
        .result {
            text-align: center;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            font-weight: bold;
            min-height: 45px;
            background: rgba(0,0,0,0.5);
        }
        .result.win {
            background: rgba(0,150,0,0.5);
            border: 2px solid #00ff00;
            color: #00ff00;
        }
        .result.lose {
            background: rgba(150,0,0,0.5);
            border: 2px solid #ff0000;
            color: #ff6666;
        }
        .bottom-nav {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
        }
        .nav-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 10px;
            color: #aaa;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn.active {
            border-color: #ff8c00;
            color: #ff8c00;
            background: rgba(255,140,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦫 BOBER SLOTS</h1>
            <div class="balance">💰 <span id="balance">10000</span> монет</div>
        </div>

        <div id="slots-screen">
            <div class="slots-frame">
                <div class="slots-display">
                    <div class="slot" id="slot1">🦫</div>
                    <div class="slot" id="slot2">🦫</div>
                    <div class="slot" id="slot3">🦫</div>
                </div>
            </div>
            <div class="bet-controls">
                <label>Ставка:</label>
                <input type="number" id="slot-bet" min="10" value="100">
                <div class="quick-bets">
                    <button onclick="setBet(50)">50</button>
                    <button onclick="setBet(100)">100</button>
                    <button onclick="setBet(500)">500</button>
                    <button onclick="setBet(1000)">1000</button>
                </div>
            </div>
            <button class="spin-btn" id="spin-button" onclick="spinSlots()">🎰 КРУТИТЬ</button>
            <div id="slot-result" class="result"></div>
        </div>

        <div id="dice-screen" style="display:none;">
            <div class="dice-display">
                <div class="dice" id="dice">🎲</div>
            </div>
            <div class="dice-bet-type">
                <button class="dice-type-btn active" onclick="setDiceType('high')">⬆️ Больше 3 (x1.5)</button>
                <button class="dice-type-btn" onclick="setDiceType('low')">⬇️ Меньше 4 (x1.5)</button>
                <button class="dice-type-btn" onclick="setDiceType('exact')">🎯 Ровно 6 (x5)</button>
            </div>
            <div class="bet-controls">
                <label>Ставка:</label>
                <input type="number" id="dice-bet" min="10" value="100">
                <div class="quick-bets">
                    <button onclick="setDiceBet(50)">50</button>
                    <button onclick="setDiceBet(100)">100</button>
                    <button onclick="setDiceBet(500)">500</button>
                    <button onclick="setDiceBet(1000)">1000</button>
                </div>
            </div>
            <button class="roll-btn" id="roll-button" onclick="rollDice()">🎲 БРОСИТЬ</button>
            <div id="dice-result" class="result"></div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn active" id="nav-slots" onclick="showScreen('slots')">🎰 Слоты</button>
            <button class="nav-btn" id="nav-dice" onclick="showScreen('dice')">🎲 Кости</button>
        </div>
    </div>

    <script>
        // Всё в одном файле
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        let balance = 10000;
        let diceType = 'high';
        
        document.getElementById('balance').textContent = balance;
        
        function setBet(a) { document.getElementById('slot-bet').value = a; }
        function setDiceBet(a) { document.getElementById('dice-bet').value = a; }
        
        function setDiceType(t) {
            diceType = t;
            document.querySelectorAll('.dice-type-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function showScreen(s) {
            document.getElementById('slots-screen').style.display = s === 'slots' ? 'block' : 'none';
            document.getElementById('dice-screen').style.display = s === 'dice' ? 'block' : 'none';
            document.getElementById('nav-slots').classList.toggle('active', s === 'slots');
            document.getElementById('nav-dice').classList.toggle('active', s === 'dice');
        }
        
        function updateBal() {
            document.getElementById('balance').textContent = balance;
        }
        
        function showResult(id, msg, win) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = 'result ' + (win ? 'win' : 'lose');
        }
        
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        
        const SLOTS = ['🦫', '🍋', '🍊', '🍇', '💎', '7️⃣'];
        
        async function spinSlots() {
            const btn = document.getElementById('spin-button');
            const bet = parseInt(document.getElementById('slot-bet').value);
            
            if (!bet || bet < 10) { showResult('slot-result', 'Мин. ставка: 10', false); return; }
            if (bet > balance) { showResult('slot-result', 'Недостаточно монет', false); return; }
            
            btn.disabled = true;
            balance -= bet;
            updateBal();
            
            for (let i = 0; i < 10; i++) {
                await sleep(100);
                document.getElementById('slot1').textContent = SLOTS[Math.floor(Math.random() * 6)];
                document.getElementById('slot2').textContent = SLOTS[Math.floor(Math.random() * 6)];
                document.getElementById('slot3').textContent = SLOTS[Math.floor(Math.random() * 6)];
            }
            
            const r = [SLOTS[Math.floor(Math.random() * 6)], SLOTS[Math.floor(Math.random() * 6)], SLOTS[Math.floor(Math.random() * 6)]];
            document.getElementById('slot1').textContent = r[0];
            document.getElementById('slot2').textContent = r[1];
            document.getElementById('slot3').textContent = r[2];
            
            let win = 0, msg = '';
            if (r[0] === r[1] && r[1] === r[2]) {
                let m = r[0] === '7️⃣' ? 10 : r[0] === '💎' ? 15 : 5;
                win = bet * m;
                msg = '🎉 ДЖЕКПОТ! x' + m + '\n+' + win;
            } else if (r[0] === r[1] || r[1] === r[2] || r[0] === r[2]) {
                win = Math.floor(bet * 1.5);
                msg = '✅ Два совпадения! x1.5\n+' + win;
            } else {
                msg = '😔 Не повезло\n-' + bet;
            }
            
            balance += win;
            updateBal();
            showResult('slot-result', msg, win > 0);
            btn.disabled = false;
        }
        
        async function rollDice() {
            const btn = document.getElementById('roll-button');
            const bet = parseInt(document.getElementById('dice-bet').value);
            
            if (!bet || bet < 10) { showResult('dice-result', 'Мин. ставка: 10', false); return; }
            if (bet > balance) { showResult('dice-result', 'Недостаточно монет', false); return; }
            
            btn.disabled = true;
            balance -= bet;
            updateBal();
            
            const FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            for (let i = 0; i < 10; i++) {
                await sleep(80);
                document.getElementById('dice').textContent = FACES[Math.floor(Math.random() * 6)];
            }
            
            const r = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice').textContent = FACES[r - 1];
            
            let win = false, mult = 0;
            if (diceType === 'high' && r > 3) { win = true; mult = 1.5; }
            if (diceType === 'low' && r < 4) { win = true; mult = 1.5; }
            if (diceType === 'exact' && r === 6) { win = true; mult = 5; }
            
            let msg = 'Выпало: ' + r + '\n';
            if (win) {
                const wa = Math.floor(bet * mult);
                balance += wa;
                msg += '🎉 Победа! x' + mult + '\n+' + wa;
            } else {
                msg += '😔 Мимо\n-' + bet;
            }
            
            updateBal();
            showResult('dice-result', msg, win);
            btn.disabled = false;
        }
    </script>
</body>
</html>
EOF
